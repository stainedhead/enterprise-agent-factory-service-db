"#5f6b7a"/></marker><marker id="arrow-neutral-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="arrow-danger-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d13212"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="arrow-dark-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><rect x="0" y="0" width="1400" height="6" fill="#ff9900"/><text x="32" y="44" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16191f">Roles and row-level security</text><text x="32" y="68" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6b7a">Each service connects as its own least-privilege role. The API role sees only the caller's teams, enforced inside PostgreSQL.</text><polyline points="220,146 290,146" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="220,242 290,242" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="220,338 290,338" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="220,434 290,434" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="220,530 290,530" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="690,146 725,146 725,151 760,151" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="1065,192 1065,250" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="906.4,332 906.4,361 905,361 905,390" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><polyline points="1223.6,332 1223.6,361 1225,361 1225,390" fill="none" stroke="#d13212" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow-danger)" /><g><rect x="30" y="110" width="190" height="72" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="30" y="110" width="5" height="72" rx="2" fill="#0972d3" opacity="0.9"/><text x="125" y="151" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">afs-api</text></g><g><rect x="290" y="110" width="400" height="72" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="290" y="110" width="5" height="72" rx="2" fill="#1d8102" opacity="0.9"/><text x="490" y="142.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">afs_app</text><text x="490" y="161.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">desired state read/write, audit + outbox insert; RLS applies</text></g><g><rect x="30" y="206" width="190" height="72" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="30" y="206" width="5" height="72" rx="2" fill="#ec7211" opacity="0.9"/><text x="125" y="247" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-reconciler</text></g><g><rect x="290" y="206" width="400" height="72" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="290" y="206" width="5" height="72" rx="2" fill="#1d8102" opacity="0.9"/><text x="490" y="238.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">afs_reconciler</text><text x="490" y="257.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">read all; write status, lifecycle, outbox publication</text></g><g><rect x="30" y="302" width="190" height="72" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="30" y="302" width="5" height="72" rx="2" fill="#ec7211" opacity="0.9"/><text x="125" y="343" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-gateway</text></g><g><rect x="290" y="302" width="400" height="72" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="290" y="302" width="5" height="72" rx="2" fill="#1d8102" opacity="0.9"/><text x="490" y="334.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">afs_gateway</text><text x="490" y="353.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">read budgets and prices; reserve, settle, insert usage</text></g><g><rect x="30" y="398" width="190" height="72" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="30" y="398" width="5" height="72" rx="2" fill="#ec7211" opacity="0.9"/><text x="125" y="439" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">afs-billing</text></g><g><rect x="290" y="398" width="400" height="72" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="290" y="398" width="5" height="72" rx="2" fill="#1d8102" opacity="0.9"/><text x="490" y="430.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">afs_billing</text><text x="490" y="449.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">write daily costs and reconciliations</text></g><g><rect x="30" y="494" width="190" height="72" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="30" y="494" width="5" height="72" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="125" y="535" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">reporting, support</text></g><g><rect x="290" y="494" width="400" height="72" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="290" y="494" width="5" height="72" rx="2" fill="#1d8102" opacity="0.9"/><text x="490" y="526.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">afs_readonly</text><text x="490" y="545.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">read all except key hashes and audit payloads</text></g><g><rect x="760" y="110" width="610" height="82" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="760" y="110" width="5" height="82" rx="2" fill="#0972d3" opacity="0.9"/><text x="1065" y="139" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">Per transaction, afs-api runs SET LOCAL</text><text x="1065" y="158" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#414d5c">afs.actor = 'usr_…'   afs.team_ids = 'team_A,team_B'</text><text x="1065" y="175" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#414d5c">afs.service_admin = off   afs.security_operator = off</text></g><g><rect x="760" y="250" width="610" height="82" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="760" y="250" width="5" height="82" rx="2" fill="#1d8102" opacity="0.9"/><text x="1065" y="279" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">Policy on every team-owned table</text><text x="1065" y="298" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#414d5c">USING (afs.caller_sees_team(team_id))</text><text x="1065" y="315" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" fill="#414d5c">WITH CHECK (afs.caller_sees_team(team_id))</text></g><g><rect x="760" y="390" width="290" height="65" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="760" y="390" width="5" height="65" rx="2" fill="#1d8102" opacity="0.9"/><text x="905" y="419" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">team_A rows</text><text x="905" y="438" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">visible and writable</text></g><g><rect x="1080" y="390" width="290" height="65" rx="10" fill="#fdeeec" stroke="#d13212" stroke-width="1.6"/><rect x="1080" y="390" width="5" height="65" rx="2" fill="#d13212" opacity="0.9"/><text x="1225" y="419" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#6b1104">team_C rows</text><text x="1225" y="438" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">invisible; writes change nothing</text></g><text x="760" y="520" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">afs.audit_log rejects UPDATE, DELETE and TRUNCATE by trigger.</text><text x="760" y="537.5" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">TestCrossTeamWritesChangeNothing seeds other teams' rows in every</text><text x="760" y="555" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">team-owned table and proves they cannot be read or changed.</text><text x="1376" y="626" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · db-roles-rls</text></svg>
